# Static host for the built SPA. Routes such as /menu and /admin are real URLs,
# so anything without a file falls back to index.html.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build output — safe to cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dish photography, favicon, fonts.
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # The shell must always be revalidated so a deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (/, /menu, /checkout, /terms, /admin …).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
